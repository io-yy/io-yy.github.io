<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>關於 — idunno</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f7f3ed; --bg-warm: #ede4d6;
      --border: #d9ccba; --border-light: #e8dfd2;
      --text-dark: #2c2218; --text-mid: #5e4e38;
      --text-muted: #8a7560; --text-faint: #9a8468;
      --accent: #b5915a;
    }
    body { font-family: 'Lora', Georgia, serif; background: var(--bg); color: var(--text-dark); min-height: 100vh; font-size: 16px; line-height: 1.8; }
    header { position: sticky; top: 0; z-index: 100; background: var(--bg); border-bottom: 1px solid var(--border); }
    .nav-inner { max-width: 860px; margin: 0 auto; padding: 0 2rem; height: 56px; display: flex; align-items: center; justify-content: space-between; }
    .site-brand { font-family: 'Playfair Display', Georgia, serif; font-size: 20px; font-weight: 600; font-style: italic; color: var(--text-dark); text-decoration: none; }
    nav { display: flex; gap: 2rem; }
    nav a { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-faint); text-decoration: none; transition: color 0.2s; }
    nav a:hover { color: var(--text-dark); }

    .page-wrap { max-width: 620px; margin: 0 auto; padding: 3.5rem 2rem 5rem; }

    .page-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 36px; font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 0.4rem;
    }

    .title-divider { width: 40px; height: 1px; background: var(--accent); margin: 1rem 0 2.5rem; }

    .about-body p { font-size: 16px; color: var(--text-mid); line-height: 1.9; margin-bottom: 1.4rem; }

    .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin: 2.5rem 0; }
    .stat-card { background: var(--bg-warm); border-radius: 4px; padding: 1.1rem; text-align: center; }
    .stat-num { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 600; color: var(--text-dark); display: block; }
    .stat-label { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-faint); margin-top: 4px; display: block; }

    footer { border-top: 1px solid var(--border); text-align: center; padding: 1.8rem 2rem; font-size: 12px; color: var(--text-faint); letter-spacing: 0.06em; }
  </style>
</head>
<body>
  <header>
    <div class="nav-inner">
      <a class="site-brand" href="index.html">idunno</a>
      <nav>
        <a href="index.html">首頁</a>
        <a href="about.html">關於</a>
      </nav>
    </div>
  </header>

  <div class="page-wrap">
    <h1 class="page-title">關於</h1>
    <div class="title-divider"></div>

    <div class="stat-row">
      <div class="stat-card">
        <span class="stat-num">4</span>
        <span class="stat-label">篇書評</span>
      </div>
      <div class="stat-card">
        <span class="stat-num">39</span>
        <span class="stat-label">本讀完</span>
      </div>
      <div class="stat-card">
        <span class="stat-num">6</span>
        <span class="stat-label">種類型</span>
      </div>
    </div>

    <!-- ★ 修改這裡：寫你自己的自我介紹 -->
    <div class="about-body">
      <p>
        idunno，記錄一些自己也不知道的事。
      </p>
      <p>
        看書看見另外一個世界的視角，留下書評是為了記住書裡的隻言片語留下的回響。試著紀錄——有時候說得清楚，有時候不行。
      </p>
      <p>
        喜歡小說、哲學、旅行文學，偶爾讀推理。捨不得故事終結，所以決定把感想寫下來，記憶會永恆存在。
      </p>
    </div>
  </div>

  <footer>
    © 2025 idunno &ensp;·&ensp; Petit à petit, Soyez Tranquille 
  </footer>
</body>
</html>
